name: Build Symphony PyPI distributions

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build all release distributions
        run: |
          uv build --package symphony-core -o dist
          uv build --package symphony-harness -o dist
          uv build --package symphony-code -o dist

      - name: Upload build artifact (not published)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
