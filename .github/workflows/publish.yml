name: Upload Python Packages to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install modern, hyper-fast Astral uv
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      # 2. Build publishable packages (not core_server)
      - name: Build release distributions
        run: |
          uv build --package symphony-core -o core_ai/dist
          uv build --package symphony-harness -o core_harness/dist
          uv build --package symphony-coding-agent -o coding_agent/dist

      # 3. Aggregated distributions go to artifact storage
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          # uv deposits each wheel/tarball in <package>/dist/
          path: |
            core_harness/dist/
            coding_agent/dist/
            core_ai/dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # MANDATORY for modern passwordless PyPI Trusted Publishing OIDC authentication
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: combined-dist/

      # 4. Publish via standard security actions
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: combined-dist/
          # Skips packages already on PyPI if you bump individual versions incrementally
          skip-existing: true
