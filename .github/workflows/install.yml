name: install

on:
  pull_request:
    paths: ["install.sh", ".github/workflows/install.yml"]
  push:
    branches: [main]
    paths: ["install.sh", ".github/workflows/install.yml"]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --shell=sh install.sh

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SYMPHONY_VERSION: "0.0.1"
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sh install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check version
        run: symphony --version | tee /tmp/v && grep -q "0.0.1" /tmp/v
      - name: Re-run (upgrade path)
        run: sh install.sh && symphony --version
      - name: Uninstall
        run: |
          sh install.sh --uninstall
          if command -v symphony; then echo "symphony still present"; exit 1; fi
