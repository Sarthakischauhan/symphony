name: Publish symphony-harness to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Check release tag
        # A release publishes symphony-harness only when its tag names this package's
        # version; otherwise the package is unchanged and the job skips.
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' core_harness/pyproject.toml)
          if [ "$RELEASE_TAG" = "v$version" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "symphony-harness is $version; $RELEASE_TAG does not release it."
          fi

      - name: Build symphony-harness
        if: steps.tag.outputs.publish == 'true'
        run: uv build --package symphony-harness -o dist

      - name: Publish symphony-harness
        if: steps.tag.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
