[project]
name = "symphony-harness"
version = "0.1.0"
description = "Symphony agent harness: provider-agnostic tool loop, control-plane events, run limits, and compaction (import as core_harness)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sarthak Chauhan", email = "sarthakchauhann@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "symphony-core",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Sarthakischauhan/symphony"
Documentation = "https://github.com/Sarthakischauhan/symphony/blob/main/docs/packages/symphony-harness.md"
Source = "https://github.com/Sarthakischauhan/symphony/tree/main/core_harness"

[tool.uv.sources]
symphony-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "core_harness"
