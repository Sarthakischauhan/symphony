[project]
name = "coding-agent"
version = "0.1.0"
description = "Minimal coding agent built on core_harness"
readme = "README.md"
authors = [
    { name = "Sarthak Chauhan", email = "sarthakchauhann@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "core-ai",
    "core-harness",
]

[tool.uv.sources]
core-ai = { workspace = true }
core-harness = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
