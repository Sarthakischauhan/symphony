[project]
name = "symphony-code"
version = "0.1.0"
description = "Symphony coding agent: workspace tools, SQLite sessions, and a Textual TUI on top of symphony-harness (import as coding_agent; run as `symphony`)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sarthak Chauhan", email = "sarthakchauhann@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "symphony-core",
    "symphony-harness",
    "pillow>=12.3.0",
    "pydantic>=2.0.0",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/Sarthakischauhan/symphony"
Documentation = "https://github.com/Sarthakischauhan/symphony/blob/main/docs/packages/symphony-code.md"
Source = "https://github.com/Sarthakischauhan/symphony/tree/main/coding_agent"

[project.scripts]
# `symphony` is the primary command; the other two are aliases kept for
# compatibility and all resolve to the same entry point.
symphony = "coding_agent.tui.__main__:main"
symphony-code = "coding_agent.tui.__main__:main"
coding-agent-tui = "coding_agent.tui.__main__:main"

[tool.uv.sources]
symphony-core = { workspace = true }
symphony-harness = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "coding_agent"
