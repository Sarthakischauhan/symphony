[css.modal]
base = '''
#modal-close {
    dock: right;
    width: 7;
    height: 1;
    color: #737373;
    content-align: right middle;
    background: #0A0A0A;
}

#modal-close:hover,
#modal-close:focus {
    color: #f2d675;
    text-style: bold;
    background: #0A0A0A;
}

.modal-pane {
    width: 86%;
    max-width: 132;
    height: 84%;
    padding: 2 3;
    background: #0A0A0A;
    border: round #383838;
}

.modal-body {
    width: 100%;
    height: 1fr;
    padding: 1 1 2 1;
    scrollbar-size: 1 1;
    scrollbar-color: #343434;
    scrollbar-color-active: #525252;
    scrollbar-color-hover: #484848;
    scrollbar-background: #0A0A0A;
    scrollbar-background-active: #0A0A0A;
    scrollbar-background-hover: #0A0A0A;
}

.content-card {
    width: 100%;
    height: auto;
    margin-bottom: 2;
    padding: 1 2 2 2;
    color: #bdbdbd;
    background: #121212;
    border-top: solid #303030;
}

.empty-state {
    width: 100%;
    height: auto;
    padding: 4 5;
    margin: 2 0;
    content-align: center middle;
    text-align: center;
    background: #121212;
}

.modal-footer {
    width: 100%;
    height: 2;
    padding: 1 1 0 1;
    color: #686868;
    background: #0A0A0A;
}
'''
