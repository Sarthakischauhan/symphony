# Symphony TUI theme — palette tokens and Textual CSS.
#
# This file is the source of truth for the default dark theme. The TUI
# loader reads it (repo `config/theme.toml` when present, otherwise the
# copy packaged with symphony-code) and exposes the same Python names as
# before: APP_CSS, SYMPHONY_COLORS, per-surface *_CSS, and Rich helpers.
#
# [css.variables] maps Textual `$name` declarations onto [colors] keys so
# chrome CSS and Rich tokens stay on one palette.

[colors]
background = "#0A0A0A"
foreground = "#EDEDED"
accent = "#A371F7"
muted = "#737373"
muted_dim = "#737373"
edge = "#262626"
comment = "#737373"
keyword = "#db6767"
type_keywords = "#db6767"
string = "#799e7c"
function = "#6374d0"
variable = "#EDEDED"
number = "#d08a61"
operator = "#6b6b6b"
punctuation = "#525252"
type = "#cda059"
tag = "#5a9a95"
attribute = "#8ca0cc"
constant = "#d08a61"
surface = "#171717"
overlay = "#262626"
subtext = "#A3A3A3"
accent_plan = "#D8BD62"
panel_edge_focus = "#484F58"

[css.variables]
background = "background"
foreground = "foreground"
accent = "accent"
accent-plan = "accent_plan"
muted = "muted"
muted-dim = "muted_dim"
panel = "surface"
panel-light = "overlay"
panel-edge = "edge"
panel-edge-focus = "panel_edge_focus"

[css]
chrome = '''
Screen {
    layout: vertical;
    background: $background;
    color: $foreground;
}

#topbar {
    width: 100%;
    height: 2;
    padding: 1 3 0 3;
    color: $muted-dim;
    background: $background;
}

#transcript {
    width: 100%;
    height: 1fr;
    padding: 0 3 1 3;
    /* Keep scrollbars out of the way until the user interacts with them. */
    scrollbar-size: 1 1;
    scrollbar-size-vertical: 1;
    scrollbar-color: transparent;
    scrollbar-color-hover: $panel-edge;
    scrollbar-color-active: $panel-edge-focus;
    scrollbar-background: transparent;
    scrollbar-background-hover: transparent;
    scrollbar-background-active: transparent;
}

.welcome {
    width: 72;
    height: auto;
    min-height: 10;
    margin: 2 0 1 1;
    padding: 1 2;
    border-left: thick $panel-edge;
    color: $muted;
}

.message {
    width: 100%;
    height: auto;
    margin: 1 0 0 1;
    padding: 0 2;
}

/* The user prompt is rendered as an accent `>` glyph plus the prompt text
   (see UserMessage); the glyph replaces the old coloured left border. */
.user-message {
    background: $background;
    padding: 0;
}

.run-summary {
    margin: 2 0 0 1;
    background: $background;
    border-left: solid #9b7bc3;
    padding: 1 2;
    color: #c2b5cf;
}

/* RunProcess and RunSummary animate opacity on mount, using Textual's
   event-loop animation driver rather than blocking streamed output. */

.assistant-message {
    padding-left: 3;
    background: $background;
}

.thinking-status {
    width: auto;
    max-width: 72;
    height: 1;
    margin: 1 0 1 1;
    padding: 0 1 0 3;
    color: $muted;
}

.run-process {
    width: 100%;
    height: auto;
    margin: 0 0 1 0;
    padding: 0 0 0 3;
    background: $background;
}

.process-complete {
    width: auto;
    height: 1;
    margin: 1 0 0 1;
    color: #5f6a62;
}

.reasoning-block {
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
    color: #5b9bd5;
    background: $background;
    pointer: pointer;
}

.reasoning-block > CollapsibleTitle {
    width: auto;
    padding: 0 1;
    color: #5b9bd5;
    background: $background;
    pointer: pointer;
}

.reasoning-block.is-complete > CollapsibleTitle {
    color: #5b9bd5;
}

.reasoning-block > CollapsibleTitle:hover {
    color: #83b8e8;
    background: $panel;
}

.reasoning-block > Contents {
    padding: 0;
}

.reasoning-scroll {
    width: 100%;
    height: auto;
    max-height: 12;
    padding: 0;
    scrollbar-size: 1 1;
    scrollbar-color: transparent;
    scrollbar-color-hover: #606060;
    scrollbar-color-active: #707070;
    scrollbar-background: transparent;
    scrollbar-background-hover: transparent;
    scrollbar-background-active: transparent;
}

.reasoning-text {
    width: 100%;
    height: auto;
    color: #858585;
}
'''
tools = '''
.tool-call {
    width: 100%;
    height: auto;
    min-height: 1;
    margin: 0;
    padding: 0;
    background: $background;
    pointer: pointer;
}

.tool-call > CollapsibleTitle {
    width: 1;
    height: 0;
    padding: 0;
    color: transparent;
    background: transparent;
}

.bash-tool > CollapsibleTitle {
    display: none;
}

.tool-call-header {
    width: 100%;
    height: 1;
    padding: 0 1;
    background: $background;
    pointer: pointer;
}

.tool-call-header:hover,
.tool-call-header:focus {
    background: $panel;
}

.tool-call-label {
    width: 13;
    height: 1;
    color: #666666;
    background: transparent;
}

.tool-call-command {
    width: 1fr;
    height: 1;
    color: #c8c8c8;
    background: transparent;
    overflow: hidden;
    text-overflow: ellipsis;
}

.tool-call-status {
    width: 10;
    height: 1;
    padding-left: 2;
    color: #666666;
    text-align: right;
    background: transparent;
}

.tool-call.status-preparing .tool-call-label,
.tool-call.status-preparing .tool-call-status,
.tool-call.status-running .tool-call-label,
.tool-call.status-running .tool-call-status {
    color: #d7a84b;
}

.tool-call.status-done .tool-call-label,
.tool-call.status-done .tool-call-status {
    color: #72a57a;
}

.tool-call.status-failed .tool-call-label,
.tool-call.status-failed .tool-call-status {
    color: #d66b73;
}

.tool-call > Contents {
    padding: 0;
}

.tool-call.status-preparing > CollapsibleTitle,
.tool-call.status-running > CollapsibleTitle {
    color: #d7a84b;
}

.tool-call.status-done > CollapsibleTitle {
    color: #72a57a;
}

.tool-call.status-failed > CollapsibleTitle {
    color: #d66b73;
}

.tool-call > Contents {
    padding: 0 0 0 1;
}

.bash-tool {
    padding: 0;
}

.bash-tool-header {
    width: 100%;
    height: 1;
    padding: 0 1;
    background: $background;
    pointer: pointer;
}

.bash-tool-header:hover,
.bash-tool-header:focus {
    background: $panel;
}

.bash-tool-label {
    width: 13;
    height: 1;
    color: #666666;
    background: transparent;
}

.bash-tool-command {
    width: 1fr;
    height: 1;
    color: #c8c8c8;
    background: transparent;
    overflow: hidden;
    text-overflow: ellipsis;
}

.bash-tool-status {
    width: 10;
    height: 1;
    padding-left: 2;
    color: #666666;
    text-align: right;
    background: transparent;
}

.bash-tool.status-preparing .bash-tool-label,
.bash-tool.status-preparing .bash-tool-status,
.bash-tool.status-running .bash-tool-label,
.bash-tool.status-running .bash-tool-status {
    color: #d7a84b;
}

.bash-tool.status-done .bash-tool-label,
.bash-tool.status-done .bash-tool-status {
    color: #72a57a;
}

.bash-tool.status-failed .bash-tool-label,
.bash-tool.status-failed .bash-tool-status {
    color: #d66b73;
}

.bash-tool-body {
    width: 100%;
    height: auto;
    padding: 0 1 0 3;
    color: #777777;
    background: $background;
}

.bash-tool.-collapsed .bash-tool-body {
    display: none;
}

.diff-tool {
    margin-top: 1;
    margin-bottom: 1;
    padding-bottom: 1;
    background: $background;
}

/* Keep collapsed Update cards visually consistent with the timeline while
   retaining strong line-level colors when the diff is expanded. */
.diff-tool > Contents,
.diff-tool .tool-call-header {
    background: $background;
}

.diff-tool .tool-call-header:hover,
.diff-tool .tool-call-header:focus {
    background: $panel;
}

.tool-call-summary {
    width: 1fr;
    height: auto;
    margin: 1 0 0 0;
    padding: 0 1;
    color: #a2adb8;
    background: transparent;
    pointer: pointer;
}

.tool-call-summary:hover,
.tool-call-summary:focus {
    background: transparent;
    text-style: bold;
}
'''
composer = '''
.notice {
    width: 100%;
    height: auto;
    min-height: 1;
    margin: 0 0 0 1;
    color: $muted;
}

/* Composer: a visibly rounded input container, with the all-caps mode
   label sitting on the prompt's first row at the right edge. */
#composer {
    width: 1fr;
    height: auto;
    min-height: 2;
    margin: 0 3;
    padding: 0 1;
    layout: vertical;
    background: $background;
    border: round $panel-edge;
}

#composer:focus-within {
    border: round $panel-edge-focus;
}

#composer-row {
    width: 100%;
    height: auto;
    layout: horizontal;
    background: $background;
}

#prompt {
    width: 1fr;
    max-width: 100%;
    height: auto;
    min-height: 1;
    max-height: 10;
    padding: 0 1;
    border: none;
    background: $background;
    color: $foreground;
    pointer: text;
}

#prompt:focus {
    border: none;
}

#prompt.-disabled {
    color: $muted-dim;
}

#prompt .text-area--placeholder {
    color: $muted;
}

#prompt .text-area--cursor-line {
    background: $background;
}

#composer-mode {
    width: auto;
    height: 1;
    padding: 0 0 0 3;
    color: $accent;
    background: $background;
}

#composer.plan-mode #composer-mode {
    color: $accent-plan;
}

#slash-menu {
    display: none;
    width: 1fr;
    height: auto;
    max-height: 10;
    margin: 0 3;
    padding: 1 1 0 1;
    background: $panel;
    border: round $panel-edge;
    overflow-y: auto;
    scrollbar-size-vertical: 1;
}

#approval-menu {
    display: none;
}

#slash-menu > .option-list--option {
    padding: 0;
    background: $panel;
}

#slash-menu > .option-list--option-highlighted {
    background: $panel-light;
}

#slash-menu > .option-list--option-hover {
    background: $panel-light;
}

#slash-menu > .option-list--option-disabled {
    padding: 0;
    background: $panel;
}

#transcript ScrollBar {
    pointer: pointer;
}

/* Footer: workspace and context meter on the left, keyboard hint on the right. */
#status {
    width: 100%;
    height: 2;
    padding: 1 3 0 3;
    background: $background;
    color: $muted-dim;
}

#approval-menu.permission-menu {
    width: 100%;
    max-width: 100%;
    height: auto;
    max-height: 14;
    margin: 0 0 1 0;
    offset-x: 0;
    padding: 1 1 0 1;
    border: round $panel-edge;
    background: $background;
}

#approval-menu.permission-menu > .option-list--option {
    padding: 0 1;
    background: $background;
}

#approval-menu.permission-menu > .option-list--option-disabled {
    background: $background;
}

#approval-menu.permission-menu > .option-list--option-highlighted {
    background: $panel-light;
}

#approval-menu.permission-menu > .option-list--option-hover {
    background: $panel-light;
}

#slash-menu.file-menu {
    width: 1fr;
    max-height: 12;
    margin: 0 3 1 3;
    padding: 1 1 0 1;
    background: $panel;
    border: round $panel-edge;
}

#slash-menu.file-menu > .option-list--option,
#slash-menu.file-menu > .option-list--option-disabled {
    padding: 0 1;
    background: $panel;
}

#slash-menu.file-menu > .option-list--option-highlighted,
#slash-menu.file-menu > .option-list--option-hover {
    color: $foreground;
    background: $panel-light;
}
'''
