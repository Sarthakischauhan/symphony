# Palette adapted from https://github.com/microsoft/vscode-cpptools/tree/main/Themes/themes/cpptools_light_vs_new.json
name = "C/C++ Light"
base = "light"

[colors]
background = "#ffffff"
foreground = "#000000"
surface = "#f3f3f3"
overlay = "#add6ff"
edge = "#d3d3d3"
panel_edge_focus = "#767676"
accent = "#005fa8"
muted = "#666666"
muted_dim = "#6f6f6f"
subtext = "#515151"
comment = "#008000"
keyword = "#0000ff"
type_keywords = "#0000ff"
string = "#a31515"
function = "#795e26"
variable = "#001080"
number = "#08734d"
operator = "#000000"
punctuation = "#515151"
type = "#267f99"
tag = "#800000"
attribute = "#a31515"
constant = "#0000ff"
diff_added = "#e0f1d9"
diff_removed = "#f9dfdc"
