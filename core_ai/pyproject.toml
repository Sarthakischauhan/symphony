[project]
name = "core-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sarthak Chauhan", email = "sarthakchauhann@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling", "httpx>=0.28.1", "dotenv>=0.9.9"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_ai"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts",
    "/hatch_build.py",
    "/README.md",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "hatchling",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-s"
